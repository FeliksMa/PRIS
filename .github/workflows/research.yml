name: PRIS cloud research
on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * *'
    - cron: '0,30 * * * *'
permissions:
  contents: read
concurrency:
  group: pris-cloud-runner
  cancel-in-progress: false
jobs:
  research:
    if: ${{ vars.PRIS_CLOUD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
      ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
      PRIS_RUNNER_ID: primary
      PRIS_CLOUD_URL: ${{ secrets.PRIS_CLOUD_URL }}
      PRIS_SITE_ACCESS_TOKEN: ${{ secrets.PRIS_SITE_ACCESS_TOKEN }}
      PRIS_RUNNER_TOKEN: ${{ secrets.PRIS_RUNNER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/pris.db
          key: pris-cloud-db-${{ github.run_id }}
          restore-keys: pris-cloud-db-
      - run: python -m pris.cloud --root .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pris-markdown-${{ github.run_id }}
          path: vault/PRIS/
          retention-days: 14
